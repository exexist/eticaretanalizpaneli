name: E-Ticaret Otomatik Veri Botu

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir otomatik çalıştırır
    
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Kodlarını Çek
        uses: actions/checkout@v3

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Paketleri Yükle
        run: npm install

      - name: Botu Çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scraper.js